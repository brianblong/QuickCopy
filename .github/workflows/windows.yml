name: Windows checks

on:
  push:
    branches: [main, feat/quickcopy-desktop]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m py_compile quickcopy.py tests\test_quickcopy.py
      - name: Check build script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $null = [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path .\build.ps1),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -gt 0) { throw "build.ps1 failed PowerShell parsing." }
      - name: Build executable
        shell: pwsh
        run: .\build.ps1 -Python python
